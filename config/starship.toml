add_newline = true
format = "[ ](bold #D70A53)$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #FF3B3B"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "#FF8A8A"
format = "[$symbol$branch]($style) "

[git_status]
style = "#FF8A8A"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #FF3B3B)"
error_symbol = "[❯](bold #FFD166)"
